# SLQ Dashboard on the Proxmox server - see docs/PROXMOX.md.
# Do not edit this file on the host - put your settings in
# docker-compose.override.yml (see the .example next to it). From the clone:
#   bash update.sh compose up -d --build     first start
#   bash update.sh                           updates
name: slq-dashboard
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: slq-dashboard:latest
    container_name: slq-dashboard
    restart: unless-stopped
    ports:
      - "8090:8080"            # Nginx Proxy Manager points here
    volumes:
      - slq-dashboard-data:/data   # app.db, settings.json, secret.key, logs
    environment:
      TZ: Europe/Copenhagen
      APP_DATA_DIR: /data
      APP_GO2RTC_URL: http://go2rtc:1984
    depends_on:
      - go2rtc

  # Turns the cameras' RTSP into pictures and video a browser can show. No ports:
  # only the app reaches it, so every picture passes the dashboard's login, and
  # what it knows about the cameras stays in its memory. RTSP and WebRTC are off,
  # nothing here needs them.
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: slq-dashboard-go2rtc
    restart: unless-stopped
    command: ["go2rtc", "-config", "{rtsp: {listen: ''}, webrtc: {listen: ''}, srtp: {listen: ''}}"]

volumes:
  slq-dashboard-data:
    # A named volume. To keep the data in a folder on the host instead (easier
    # to back up), set the volume in docker-compose.override.yml.
